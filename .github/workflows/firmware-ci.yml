name: Firmware CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"

jobs:
  platformio-build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: firmware/lunar-poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/lunar-poc/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run
