[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters =
  time
  colorize
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
build_flags =
  -DCORE_DEBUG_LEVEL=1
